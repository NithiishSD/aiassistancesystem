name: free_space_summary
summary: Report free and used disk space.
handler: _run_native_function
description: >-
  User wants to know how much free disk space remains overall, or a summary of used vs. available storage.
  Examples: 'how much space do I have left', 'is my drive full', 'show free disk capacity'.
tier: 0
utterances:
- >-
  Check and summarize total, used, and available remaining free disk storage space and drive capacity.
- how much free disk storage space do I have left on my drive
- is my hard drive full and what is the available free storage space
- check remaining gigabytes and disk capacity
- how much free disk space do I have
short_examples:
- how much storage do i have left
- is my disk full
- free space left?
- how much room on my drive
- remaining disk space
- any storage left on this machine
