# threshold 0.45, not the 0.55 default (ROADMAP A5, golden DEV slice): 10 correct / 0 wrong at 0.45 (7 at 0.55); highest wrong match 0.40.
name: search_files
summary: Find files and folders on this computer by name or type.
handler: _run_native_function
description: >-
  User wants to find, locate, or search for a file or directory on the local filesystem by name, extension,
  or path pattern. Examples: 'find my resume', 'where is notes.txt', 'search for .cpp files'.
tier: 0
threshold: 0.45
utterances:
- >-
  Search, find, locate, discover, or list files, documents, scripts, and directories on the local disk
  by filename, path, extension, or pattern.
- find where my file or document is stored on my computer
- search the filesystem for files matching a name or extension
- locate my notes, assignments, pdfs, code files, or downloads
- find my resume file
- where did I save my project report
- find all files with extension .cpp
short_examples:
- find my notes pdf
- where is my offer letter
- search for my report file
- locate the spreadsheet i made
- find all my python files
- where did i save the slides
- look for a file called draft
- find the pdf i downloaded
- search my laptop for photos
